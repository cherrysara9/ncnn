name: test-coverage
concurrency:
  group: test-coverage-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux-gcc-gpu-t4:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.0.3
      with:
        submodules: true
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG pre-build context"
        GH_HEAD_REF=${{ toJSON(github.head_ref) }}
        GH_SHA=${{ toJSON(github.sha) }}
        GH_REF=${{ toJSON(github.ref) }}
        GH_BASE=${{ toJSON(github.base_ref) }}
        printf 'GERALT_DBG head_ref=%s\n' "$GH_HEAD_REF"
        printf 'GERALT_DBG sha=%s\n' "$GH_SHA"
        printf 'GERALT_DBG ref=%s\n' "$GH_REF"
        printf 'GERALT_DBG base_ref=%s\n' "$GH_BASE"
        if [ -f CMakeLists.txt ]; then echo "GERALT_DBG CMakeLists.txt head:"; head -n 40 CMakeLists.txt 2>/dev/null || true; else echo "GERALT_DBG CMakeLists.txt not found"; fi
        if [ -d tests ]; then echo "GERALT_DBG tests listing:"; ls -la tests 2>/dev/null || true; else echo "GERALT_DBG tests dir not found"; fi
        if [ -d toolchains ]; then echo "GERALT_DBG toolchains listing:"; ls -la toolchains 2>/dev/null || true; else echo "GERALT_DBG toolchains not found"; fi
      continue-on-error: true
    - name: build
      env:
        CC: gcc
        CXX: g++
        LD_LIBRARY_PATH: /data/action/install/lib64
      run: |
        mkdir build && cd build
        cmake -DCMAKE_BUILD_TYPE=debug -DNCNN_VULKAN=ON -DNCNN_COVERAGE=ON -DNCNN_RUNTIME_CPU=OFF -DNCNN_AVX2=ON -DNCNN_XOP=OFF -DNCNN_AVXVNNI=OFF -DNCNN_AVXNECONVERT=OFF -DNCNN_AVX512=OFF -DNCNN_OPENMP=OFF -DNCNN_BUILD_TOOLS=OFF -DNCNN_BUILD_EXAMPLES=OFF -DNCNN_BUILD_TESTS=ON ..
        cmake --build . -j 4
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG pre-test context"
        if [ -d build ]; then ls -la build 2>/dev/null || true; if [ -f build/CTestTestfile.cmake ]; then echo "GERALT_DBG CTestTestfile.cmake:"; head -n 60 build/CTestTestfile.cmake 2>/dev/null || true; else echo "GERALT_DBG build/CTestTestfile.cmake not found"; fi; else echo "GERALT_DBG build dir not found (configure may have failed)"; fi
      continue-on-error: true
    - name: test
      env:
        LD_LIBRARY_PATH: /data/action/install/lib64
      run: cd build && ctest --output-on-failure -j 4
    - name: lcov-collect
      run: |
        cd build
        lcov -d ./src -c -o lcov.info
        lcov -r lcov.info '/usr/*' -o lcov.info
        lcov -r lcov.info '*/install/*' -o lcov.info
        lcov -r lcov.info '*/build/*' -o lcov.info
        lcov --list lcov.info
    - name: codecov
      uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        disable_search: true
        plugins: noop
        binary: /data/action/.local/bin/codecov
        files: build/lcov.info
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  push:
    branches:
    - master
    paths:
    - .github/workflows/test-coverage.yml
    - CMakeLists.txt
    - cmake/**
    - src/**
    - tests/**
    - toolchains/**
    - glslang
  pull_request:
    branches:
    - master
    paths:
    - .github/workflows/test-coverage.yml
    - CMakeLists.txt
    - cmake/**
    - src/**
    - tests/**
    - toolchains/**
    - glslang
